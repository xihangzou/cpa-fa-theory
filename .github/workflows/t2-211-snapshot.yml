name: T2 #211 main snapshot

on:
  push:
    branches: [tmp-test]
    paths:
      - '.github/workflows/t2-211-snapshot.yml'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Package current main repository
        shell: bash
        run: |
          git rev-parse HEAD | tee /tmp/snapshot-base.txt
          tar -czf /tmp/cpa-fa-theory-main.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: t2-211-main-snapshot
          path: |
            /tmp/cpa-fa-theory-main.tar.gz
            /tmp/snapshot-base.txt
          retention-days: 1
