name: T3 #212 verification snapshot one-shot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/t3-snapshot-212-once.yml']
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create repository snapshot
        run: tar -czf /tmp/cpa-fa-theory-snapshot.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: t3-212-repo-snapshot
          path: /tmp/cpa-fa-theory-snapshot.tar.gz
          retention-days: 1
      - name: Remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'xihangzou'
          git config user.email '142606156+xihangzou@users.noreply.github.com'
          git pull --rebase origin main
          rm -f .github/workflows/t3-snapshot-212-once.yml
          git add .github/workflows/t3-snapshot-212-once.yml
          git diff --cached --check
          git commit -m 'ci: remove T3 #212 snapshot workflow'
          git push origin HEAD:main
