name: T3 assembly live-source evidence one-shot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/t3-assembly-live-source-once.yml']
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record completed live source verification
        shell: bash
        run: |
          git config user.name 'xihangzou'
          git config user.email '142606156+xihangzou@users.noreply.github.com'
          git pull --rebase origin main
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('project/T3/qa/assembly.json')
          q = json.loads(p.read_text(encoding='utf-8'))
          assert q.get('issue') == 212
          assert q.get('status') == 'pass' and q.get('unresolved_count') == 0
          assert q['source_identity']['pdf_sha256'] == '1d9f0124a0c8ef759526decc90a1a410f694e2b7fa992b430fc413e783df85bc'
          q['source_identity']['catalog_image_inventory_sha256'] = 'af94a7c1f91d1eb56611afc242360566950d6f93d5a6ac7d5271c5e8d3f9d170'
          q['assembly']['live_image_hash_check'] = {
            'status': 'pass',
            'verified_on': '2026-09-08',
            'source_pdf_sha256': '1d9f0124a0c8ef759526decc90a1a410f694e2b7fa992b430fc413e783df85bc',
            'source_pdf_physical_pages': 344,
            'render_method': 'Poppler pdftoppm -jpeg -r 200 -jpegopt quality=95 using MediaBox',
            'rendered_jpg_count': 344,
            'catalog_image_inventory_sha256_computed': 'af94a7c1f91d1eb56611afc242360566950d6f93d5a6ac7d5271c5e8d3f9d170',
            'catalog_image_inventory_sha256_expected': 'af94a7c1f91d1eb56611afc242360566950d6f93d5a6ac7d5271c5e8d3f9d170',
            'catalog_inventory_match': True,
            'direct_designated_jpg_sample': {
              'page': 'T3:001',
              'filename': 'page-001.jpg',
              'drive_copy_sha256': '87d4377ceeb12610da3ca02668676905091ad862596f9fc6b87d330a2944d79b',
              'rendered_sha256': '87d4377ceeb12610da3ca02668676905091ad862596f9fc6b87d330a2944d79b',
              'byte_identical': True
            },
            'evidence_note': 'The designated T3 PDF was retrieved from the connected source store; its SHA-256 matched the pinned source identity. Re-rendering all 344 physical pages reproduced the catalog image inventory digest exactly, and a directly retrieved designated JPG sample matched the reproduced byte stream.'
          }
          q['checks']['live_source_image_hashes'] = 'pass'
          q['remaining_uncertainty'] = []
          p.write_text(json.dumps(q, ensure_ascii=False, indent=2) + '\n', encoding='utf-8', newline='')
          PY
          rm -f .github/workflows/t3-assembly-live-source-once.yml
          git add project/T3/qa/assembly.json .github/workflows/t3-assembly-live-source-once.yml
          git diff --cached --check
          git commit -m 'qa(T3): complete live source validation for #212'
          git push origin HEAD:main
