name: Assemble compressed direct Markdown upload

on:
  push:
    branches: [main]
    paths:
      - 'project/_upload/unified-xz-ready'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode, assemble and verify canonical Markdown files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma

          root = Path('.')
          parts = sorted((root / 'project/_upload/unified-xz').glob('part-*.b64'))
          if not parts:
              raise SystemExit('no compressed upload parts found')
          encoded = ''.join(p.read_text(encoding='ascii') for p in parts)
          raw = lzma.decompress(base64.b64decode(encoded))
          integrated = raw.decode('utf-8')

          expected_integrated = '56dfa36dd9ba7c0744c4d6eacb43741fdd620d15df4052c742ee626c0c30ffdc'
          actual_integrated = hashlib.sha256(raw).hexdigest()
          if actual_integrated != expected_integrated:
              raise SystemExit(f'integrated hash mismatch: {actual_integrated}')

          h1 = '''# 財務会計論 短答対策問題集①（理論）

> QA済み統合版から、第1章〜第20章のレビュー済み本文を改変せず分離した最終Markdown handoff。

## 目次

- [第1章 財務会計における基礎概念](#第1章-財務会計における基礎概念)
- [第2章 一般原則](#第2章-一般原則)
- [第3章 貸借対照表・損益計算書総論](#第3章-貸借対照表-損益計算書総論)
- [第4章 損益会計](#第4章-損益会計)
- [第5章 貸借対照表総論](#第5章-貸借対照表総論)
- [第6章 資産会計総論](#第6章-資産会計総論)
- [第7章 流動資産](#第7章-流動資産)
- [第8章 固定資産](#第8章-固定資産)
- [第9章 繰延資産](#第9章-繰延資産)
- [第10章 負債会計](#第10章-負債会計)
- [第11章 資本会計（伝統論）](#第11章-資本会計-伝統論)
- [第12章 財務会計の概念フレームワーク](#第12章-財務会計の概念フレームワーク)
- [第13章 会計基準等](#第13章-会計基準等)
- [第14章 セグメント情報等の開示に関する会計基準](#第14章-セグメント情報等の開示に関する会計基準)
- [第15章 関連当事者の開示に関する会計基準](#第15章-関連当事者の開示に関する会計基準)
- [第16章 賃貸等不動産の時価等の開示に関する会計基準](#第16章-賃貸等不動産の時価等の開示に関する会計基準)
- [第17章 役員賞与に関する会計基準](#第17章-役員賞与に関する会計基準)
- [第18章 時価の算定に関する会計基準](#第18章-時価の算定に関する会計基準)
- [第19章 法人税、住民税及び事業税等に関する会計基準](#第19章-法人税-住民税及び事業税等に関する会計基準)
- [第20章 一株当たり当期純利益に関する会計基準](#第20章-一株当たり当期純利益に関する会計基準)

---

'''

          h2 = '''# 財務会計論 短答対策問題集②（理論）

> QA済み統合版から、第21章〜第41章のレビュー済み本文を改変せず分離した最終Markdown handoff。

## 目次

- [第21章 棚卸資産の評価に関する会計基準](#第21章-棚卸資産の評価に関する会計基準)
- [第22章 研究開発費等に係る会計基準](#第22章-研究開発費等に係る会計基準)
- [第23章 固定資産の減損に係る会計基準](#第23章-固定資産の減損に係る会計基準)
- [第24章 退職給付に関する会計基準](#第24章-退職給付に関する会計基準)
- [第25章 資産除去債務に関する会計基準](#第25章-資産除去債務に関する会計基準)
- [第26章 資本会計（会計基準論点）](#第26章-資本会計-会計基準論点)
- [第27章 ストック・オプション等に関する会計基準](#第27章-ストック-オプション等に関する会計基準)
- [第28章 外貨建取引等会計処理基準](#第28章-外貨建取引等会計処理基準)
- [第29章 税効果会計に係る会計基準](#第29章-税効果会計に係る会計基準)
- [第30章 リース取引に関する会計基準](#第30章-リース取引に関する会計基準)
- [第31章 会計方針の開示、会計上の変更及び誤謬の訂正に関する会計基準](#第31章-会計方針の開示-会計上の変更及び誤謬の訂正に関する会計基準)
- [第32章 四半期財務諸表に関する会計基準](#第32章-四半期財務諸表に関する会計基準)
- [第33章 金融商品に関する会計基準](#第33章-金融商品に関する会計基準)
- [第34章 収益認識に関する会計基準](#第34章-収益認識に関する会計基準)
- [第35章 連結財務諸表に関する会計基準](#第35章-連結財務諸表に関する会計基準)
- [第36章 持分法に関する会計基準](#第36章-持分法に関する会計基準)
- [第37章 包括利益の表示に関する会計基準](#第37章-包括利益の表示に関する会計基準)
- [第38章 企業結合に関する会計基準](#第38章-企業結合に関する会計基準)
- [第39章 事業分離等に関する会計基準](#第39章-事業分離等に関する会計基準)
- [第40章 連結キャッシュ・フロー計算書等の作成基準](#第40章-連結キャッシュ-フロー計算書等の作成基準)
- [第41章 特殊問題](#第41章-特殊問題)

---

'''

          start1 = integrated.index('# 第1章 財務会計における基礎概念', integrated.index('\n---\n') + 5)
          start21 = integrated.index('# 第21章 棚卸資産の評価に関する会計基準', start1)
          w1 = h1 + integrated[start1:start21 - 1]
          w2 = h2 + integrated[start21:]

          expected = {
              'W1': '54c7e3cc0497b1adb102de3627db3332ba437f55c2f4e780917cf15fb5cde55a',
              'W2': '4e8653fa408a7ff11c02a78cd4c0e55846886c9044998a4d4b61840dc6f936be',
          }
          actual = {
              'W1': hashlib.sha256(w1.encode('utf-8')).hexdigest(),
              'W2': hashlib.sha256(w2.encode('utf-8')).hexdigest(),
          }
          if actual != expected:
              raise SystemExit(f'book hash mismatch: expected={expected} actual={actual}')

          (root / '財務会計論短答対策問題集_理論_統合版.md').write_text(integrated, encoding='utf-8')
          (root / 'project/W1/merged/textbook.md').write_text(w1, encoding='utf-8')
          (root / 'project/W2/merged/textbook.md').write_text(w2, encoding='utf-8')
          print({'integrated': actual_integrated, **actual})
          PY

      - name: Commit canonical files and remove compressed staging
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '財務会計論短答対策問題集_理論_統合版.md' project/W1/merged/textbook.md project/W2/merged/textbook.md
          git rm -r project/_upload/unified-xz project/_upload/unified-xz-ready
          git commit -m 'handoff: publish three canonical theory Markdown files'
          git push origin HEAD:main
