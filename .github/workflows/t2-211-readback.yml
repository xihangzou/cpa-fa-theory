name: T2 #211 exact remote readback

on:
  push:
    branches: [tmp-test]
    paths:
      - '.github/workflows/t2-211-readback.yml'

permissions:
  contents: read

jobs:
  readback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 497d24bd45f02507e30d7d91eb774650d0869394
          fetch-depth: 1
      - name: Verify every saved owned output byte hash
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          sha=lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          expected={
            'project/T2/tasks.json':'fa37e4efcb62d383a7a86fb8430ae3f02322ca9cd63851bca1e29508c45b5360',
            'project/T2/merged/assembly.json':'407e71786acd0556827461df03bf0720e021dc2159a843d097d6fac9b804e066',
            'project/T2/merged/chapter-000.md':'374acff8a615a4f392546f61f34dceeac09c01b666959689d75bfdfe91668e0a',
            'project/T2/merged/chapter-001.md':'ac1b305ed695b134bb10a8f90b4bc81c14d3543c2a26e4c807a8d0745ea2bb8b',
            'project/T2/merged/chapter-002.md':'8140d2dea43823b891aed6a059258130a371263ab392f41f27329ea5eab31304',
            'project/T2/merged/chapter-003.md':'f210a7c08b4671b5e5a90e6e6ca3809cccac5c0332c0ac7c8fe54cab23023aae',
